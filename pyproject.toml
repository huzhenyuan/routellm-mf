[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routellm-mf"
version = "0.1.0"
description = "Local-embedding-based LLM prompt difficulty router — a controllable alternative to RouteLLM MF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "routing", "embeddings", "ollama", "local-ai"]
dependencies = [
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "openai>=1.30",          # OpenAI-compatible client (used for ollama / lmstudio)
    "pyyaml>=6.0",
    "rich>=13.0",            # Pretty console output / explainability
    "joblib>=1.3",           # Model serialisation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
routellm-calibrate = "routellm_mf.cli:calibrate"
routellm-route    = "routellm_mf.cli:route"

[tool.setuptools.packages.find]
where = ["."]
include = ["routellm_mf*"]
